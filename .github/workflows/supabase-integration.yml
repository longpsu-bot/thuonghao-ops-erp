name: Supabase Integration

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - ".github/workflows/supabase-integration.yml"
      - "supabase/**"
      - "scripts/local-supabase-status.mjs"
      - "scripts/local-supabase-status.test.mjs"
      - "scripts/provision-local-atlas-identity.mjs"
      - "scripts/verify-local-supabase-connection.mjs"
      - "scripts/provision-local-pa06c-fixture.mjs"
      - "scripts/verify-local-pa06c-supplier-evidence.mjs"
      - "scripts/import-local-master-data-snapshot.mjs"
      - "scripts/verify-local-rmvp01-master-data.mjs"
      - "scripts/verify-local-rmvp02a-recipes.mjs"
      - "scripts/verify-local-rmvp03a-planning-inputs.mjs"
      - "scripts/verify-local-rmvp04-need-generation.mjs"
      - "scripts/verify-local-rmvp05-confirmed-need-review.mjs"
      - "src/modules/atlas/connection/**"
      - "src/modules/atlas/evidence/**"
      - "src/modules/atlas/master-data/**"
      - "src/modules/atlas/recipes/**"
      - "src/modules/atlas/planning-inputs/**"
      - "src/modules/admin/SchoolAdminWorkbench.tsx"
      - "src/modules/admin/IngredientSupplierAdminWorkbench.tsx"
      - "src/modules/admin/DishRecipeAdminWorkbench.tsx"
      - ".env.example"
      - "package.json"
      - "pnpm-lock.yaml"

  push:
    branches:
      - main
    paths:
      - ".github/workflows/supabase-integration.yml"
      - "supabase/**"
      - "scripts/local-supabase-status.mjs"
      - "scripts/local-supabase-status.test.mjs"
      - "scripts/provision-local-atlas-identity.mjs"
      - "scripts/verify-local-supabase-connection.mjs"
      - "scripts/provision-local-pa06c-fixture.mjs"
      - "scripts/verify-local-pa06c-supplier-evidence.mjs"
      - "scripts/import-local-master-data-snapshot.mjs"
      - "scripts/verify-local-rmvp01-master-data.mjs"
      - "scripts/verify-local-rmvp02a-recipes.mjs"
      - "scripts/verify-local-rmvp03a-planning-inputs.mjs"
      - "scripts/verify-local-rmvp04-need-generation.mjs"
      - "scripts/verify-local-rmvp05-confirmed-need-review.mjs"
      - "src/modules/atlas/connection/**"
      - "src/modules/atlas/evidence/**"
      - "src/modules/atlas/master-data/**"
      - "src/modules/atlas/recipes/**"
      - "src/modules/atlas/planning-inputs/**"
      - "src/modules/admin/SchoolAdminWorkbench.tsx"
      - "src/modules/admin/IngredientSupplierAdminWorkbench.tsx"
      - "src/modules/admin/DishRecipeAdminWorkbench.tsx"
      - ".env.example"
      - "package.json"
      - "pnpm-lock.yaml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Supabase Smoke
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == true &&
      (github.event.action == 'opened' ||
      github.event.action == 'synchronize' ||
      github.event.action == 'reopened')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start reduced local Supabase
        shell: bash
        run: |
          set -uo pipefail
          start_log="${RUNNER_TEMP}/supabase-start.log"

          if pnpm exec supabase start \
            --exclude edge-runtime,imgproxy,logflare,mailpit,postgres-meta,realtime,storage-api,studio,supavisor,vector \
            >"${start_log}" 2>&1; then
            echo "Reduced local Supabase stack started successfully."
          else
            echo "::error::Reduced local Supabase stack failed to start."
            sed -E \
              -e '/(ANON_KEY|SERVICE_ROLE_KEY|SECRET_KEY|PUBLISHABLE_KEY|anon key|service.?role key|publishable key|secret key|JWT secret|DB URL|DATABASE_URL|postgres(ql)?:\/\/)/Id' \
              -e 's/eyJ[A-Za-z0-9._-]+/[REDACTED_JWT]/g' \
              -e 's/sb_publishable_[A-Za-z0-9._-]+/[REDACTED_PUBLISHABLE_KEY]/g' \
              -e 's/sb_secret_[A-Za-z0-9._-]+/[REDACTED_SECRET_KEY]/g' \
              -e 's/(Bearer )[A-Za-z0-9._-]+/\1[REDACTED]/g' \
              "${start_log}" | tail -n 120
            exit 1
          fi

      - name: Reset and run bounded database smoke
        run: |
          pnpm exec supabase db reset --local --no-seed
          pnpm exec supabase test db supabase/tests/atlas_current_platform_security_catalog.sql --local
          pnpm exec supabase test db supabase/tests/pa_06e_h1a_planning_quantity_policy_structure_security.sql --local
          pnpm exec supabase test db supabase/tests/pa_06e_h1a_planning_quantity_policy_revision_lifecycle.sql --local
          pnpm exec supabase test db supabase/tests/pa_06e_h1a_planning_quantity_policy_effectivity_resolution.sql --local
          pnpm exec supabase test db supabase/tests/pa_06e_h1b1_line_decision_structure_security.sql --local
          pnpm exec supabase test db supabase/tests/pa_06e_h1b1_line_decision_chain_pointer.sql --local
          pnpm exec supabase test db supabase/tests/pa_06e_h1b1_line_decision_policy_quantity_integrity.sql --local
          pnpm exec supabase test db supabase/tests/rmvp_04_connected_need_generation.sql --local
          pnpm exec supabase test db supabase/tests/rmvp_05_connected_confirmed_need_review.sql --local

      - name: Provision synthetic browser-key prerequisites
        run: |
          pnpm local:auth:provision
          pnpm local:master-data:import -- --file supabase/local/rmvp_01_master_data_snapshot.example.json
          pnpm local:rmvp02a:verify
          pnpm local:rmvp02a:verify
          pnpm local:rmvp03a:verify

      - name: Verify browser-key Connected Need Generation
        run: |
          pnpm local:rmvp04:verify
          pnpm local:rmvp05:verify

      - name: Capture bounded failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e

          sanitize() {
            sed -E \
              -e '/(ANON_KEY|SERVICE_ROLE_KEY|SECRET_KEY|PUBLISHABLE_KEY|anon key|service.?role key|publishable key|secret key|JWT secret|DB URL|DATABASE_URL|postgres(ql)?:\/\/)/Id' \
              -e 's/eyJ[A-Za-z0-9._-]+/[REDACTED_JWT]/g' \
              -e 's/sb_publishable_[A-Za-z0-9._-]+/[REDACTED_PUBLISHABLE_KEY]/g' \
              -e 's/sb_secret_[A-Za-z0-9._-]+/[REDACTED_SECRET_KEY]/g' \
              -e 's/(Bearer )[A-Za-z0-9._-]+/\1[REDACTED]/g'
          }

          free -h
          df -h
          docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
          mapfile -t containers < <(
            docker ps -a --format '{{.Names}}' |
              grep -E '^supabase_(kong|auth|rest|db)_' || true
          )
          for container in "${containers[@]}"; do
            docker inspect --format \
              'name={{.Name}} image={{.Config.Image}} state={{.State.Status}} exit_code={{.State.ExitCode}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} restart_count={{.RestartCount}}' \
              "${container}"
            docker logs --tail 160 "${container}" 2>&1 | sanitize | tail -n 160
          done

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup || true

  full-integration:
    name: Supabase Full Integration
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      (github.event.action == 'ready_for_review' ||
      (github.event.action == 'synchronize' &&
      github.event.pull_request.draft == false)))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start reduced local Supabase
        shell: bash
        run: |
          set -uo pipefail
          start_log="${RUNNER_TEMP}/supabase-start.log"

          if pnpm exec supabase start \
            --exclude edge-runtime,imgproxy,logflare,mailpit,postgres-meta,realtime,storage-api,studio,supavisor,vector \
            >"${start_log}" 2>&1; then
            echo "Reduced local Supabase stack started successfully."
          else
            echo "::error::Reduced local Supabase stack failed to start."
            sed -E \
              -e '/(ANON_KEY|SERVICE_ROLE_KEY|SECRET_KEY|PUBLISHABLE_KEY|anon key|service.?role key|publishable key|secret key|JWT secret|DB URL|DATABASE_URL|postgres(ql)?:\/\/)/Id' \
              -e 's/eyJ[A-Za-z0-9._-]+/[REDACTED_JWT]/g' \
              -e 's/sb_publishable_[A-Za-z0-9._-]+/[REDACTED_PUBLISHABLE_KEY]/g' \
              -e 's/sb_secret_[A-Za-z0-9._-]+/[REDACTED_SECRET_KEY]/g' \
              -e 's/(Bearer )[A-Za-z0-9._-]+/\1[REDACTED]/g' \
              "${start_log}" | tail -n 120
            exit 1
          fi

      - name: Reset and verify local Atlas acceptance
        run: |
          pnpm exec supabase db reset --local --no-seed
          pnpm exec supabase test db supabase/tests/atlas_current_platform_security_catalog.sql --local
          pnpm exec supabase test db supabase/tests/pa_04_supplier_direct_slice_1_foundation.sql --local
          pnpm exec supabase test db supabase/tests/pa_05b_h1_runtime_role_hardening_test.sql --local
          pnpm exec supabase test db supabase/tests/pa_05b_h2_multiline_dispatch_execution.sql --local
          pnpm exec supabase test db supabase/tests/pa_05b_h3_successful_trip_closure.sql --local
          pnpm exec supabase test db supabase/tests/pa_05b_supplier_direct_command_subset.sql --local
          pnpm exec supabase test db supabase/tests/pa_05c_authorized_read_api_wrappers.sql --local
          pnpm exec supabase test db supabase/tests/pa_05c_h2_current_command_timeline_scope.sql --local
          pnpm exec supabase test db supabase/tests/pa_05d_planning_command_family.sql --local
          pnpm exec supabase test db supabase/tests/pa_05e_procurement_command_family.sql --local
          pnpm exec supabase test db supabase/tests/pa_05f_dispatch_setup_command_family.sql --local
          pnpm exec supabase test db supabase/tests/rmvp_01_atlas_master_data.sql --local
          pnpm exec supabase test db supabase/tests/rmvp_02a_connected_recipes_bom.sql --local
          pnpm exec supabase test db supabase/tests/rmvp_02b_recipe_adjustments_effective_bom.sql --local
          pnpm exec supabase test db supabase/tests/rmvp_03a_connected_weekly_menu_attendance.sql --local
          pnpm exec supabase test db supabase/tests/pantry_02_connected_pantry_source.sql --local
          pnpm exec supabase test db supabase/tests/pa_06e_h1b1_line_decision_structure_security.sql --local
          pnpm exec supabase test db supabase/tests/pa_06e_h1b1_line_decision_chain_pointer.sql --local
          pnpm exec supabase test db supabase/tests/pa_06e_h1b1_line_decision_policy_quantity_integrity.sql --local
          pnpm exec supabase test db supabase/tests/pa_06e_h1a_planning_quantity_policy_structure_security.sql --local
          pnpm exec supabase test db supabase/tests/pa_06e_h1a_planning_quantity_policy_revision_lifecycle.sql --local
          pnpm exec supabase test db supabase/tests/pa_06e_h1a_planning_quantity_policy_effectivity_resolution.sql --local
          pnpm exec supabase test db supabase/tests/pa_06e_h0a1_school_customer_location_foundation.sql --local
          pnpm exec supabase test db supabase/tests/pa_06e_h0a2_recipe_bom_immutable_reference_foundation.sql --local
          pnpm exec supabase test db supabase/tests/pa_06e_h0a3a_weekly_menu_persistence_foundation.sql --local
          pnpm exec supabase test db supabase/tests/pa_06e_h0a3b_attendance_structure_security.sql --local
          pnpm exec supabase test db supabase/tests/pa_06e_h0a3b_attendance_lifecycle_mutability.sql --local
          pnpm exec supabase test db supabase/tests/pa_06e_h0a3b_attendance_approval_snapshot_integrity.sql --local
          pnpm exec supabase test db supabase/tests/pa_06e_h0a4b_planning_input_readiness_structure_security.sql --local
          pnpm exec supabase test db supabase/tests/pa_06e_h0a4b_planning_input_readiness_evaluation_source_snapshot_integrity.sql --local
          pnpm exec supabase test db supabase/tests/pa_06e_h0a4b_planning_input_readiness_lifecycle_issues_invalidation.sql --local
          pnpm exec supabase test db supabase/tests/rmvp_03b_connected_planning_input_readiness.sql --local
          pnpm exec supabase test db supabase/tests/pa_06e_h0a5b_need_generation_structure_security.sql --local
          pnpm exec supabase test db supabase/tests/pa_06e_h0a5b_need_generation_run_input_recipe_calculation_integrity.sql --local
          pnpm exec supabase test db supabase/tests/pa_06e_h0a5b_theoretical_line_source_predecessor_release_integrity.sql --local
          pnpm exec supabase test db supabase/tests/pa_06e_h0a5b_need_generation_lifecycle_issues_invalidation_history.sql --local
          pnpm exec supabase test db supabase/tests/pa_06e_h0b1b_confirmed_need_structure_security_catalog.sql --local
          pnpm exec supabase test db supabase/tests/pa_06e_h0b1b_wholesale_compatibility_source_classification.sql --local
          pnpm exec supabase test db supabase/tests/pa_06e_h0b1b_school_catering_identity_current_source.sql --local
          pnpm exec supabase test db supabase/tests/pa_06e_h0b1b_contribution_membership_total_partition_history.sql --local
          pnpm exec supabase test db supabase/tests/pa_06e_h0cb_materialization_registry_security_catalog.sql --local
          pnpm exec supabase test db supabase/tests/pa_06e_h0cb_initial_materialization.sql --local
          pnpm exec supabase test db supabase/tests/pa_06e_h0cb_corrected_materialization_history.sql --local
          pnpm exec supabase test db supabase/tests/pa_06e_h0cb_errors_authorization_concurrency.sql --local
          pnpm exec supabase test db supabase/tests/pantry_ng_02_direct_ingredient_persistence_materialization.sql --local
          pnpm exec supabase test db supabase/tests/rmvp_04_connected_need_generation.sql --local
          pnpm exec supabase test db supabase/tests/rmvp_05_connected_confirmed_need_review.sql --local
          pnpm exec supabase test db supabase/tests/pa_05g_backend_end_to_end_acceptance.sql --local
          pnpm exec supabase test db supabase/tests/pa_05c_h3_evidence_readiness_current_command_context.sql --local
          pnpm local:auth:provision
          pnpm local:connection:verify
          pnpm local:pa06c:provision
          pnpm local:pa06c:verify
          pnpm local:master-data:import -- --file supabase/local/rmvp_01_master_data_snapshot.example.json
          pnpm local:rmvp01:verify

      - name: Verify browser-key Recipe successor lineage
        run: |
          pnpm local:rmvp02a:verify
          pnpm local:rmvp02b:verify

      - name: Verify browser-key Planning inputs
        run: |
          pnpm local:rmvp03a:verify
          pnpm local:pantry02:verify

      - name: Verify browser-key Connected Need Generation
        run: |
          pnpm local:rmvp04:verify
          pnpm local:rmvp05:verify

      - name: Capture bounded failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e

          sanitize() {
            sed -E \
              -e '/(ANON_KEY|SERVICE_ROLE_KEY|SECRET_KEY|PUBLISHABLE_KEY|anon key|service.?role key|publishable key|secret key|JWT secret|DB URL|DATABASE_URL|postgres(ql)?:\/\/)/Id' \
              -e 's/eyJ[A-Za-z0-9._-]+/[REDACTED_JWT]/g' \
              -e 's/sb_publishable_[A-Za-z0-9._-]+/[REDACTED_PUBLISHABLE_KEY]/g' \
              -e 's/sb_secret_[A-Za-z0-9._-]+/[REDACTED_SECRET_KEY]/g' \
              -e 's/(Bearer )[A-Za-z0-9._-]+/\1[REDACTED]/g'
          }

          echo "Runner memory"
          free -h
          echo "Runner disk"
          df -h
          echo "Docker version"
          docker version
          echo "Docker info"
          docker info
          echo "Container summary"
          docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
          echo "Container resource snapshot"
          docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}'

