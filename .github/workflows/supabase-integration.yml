name: Supabase Integration

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - ".github/workflows/supabase-integration.yml"
      - "supabase/**"
      - "scripts/atlas-staging-contract.mjs"
      - "scripts/atlas-staging-contract.test.mjs"
      - "scripts/deploy-atlas-staging.mjs"
      - "scripts/certify-frontend.mjs"
      - "scripts/certify-supabase-full-integration.mjs"
      - "scripts/verify-atlas-staging.mjs"
      - "scripts/install-atlas-staging-package.mjs"
      - "scripts/install-local-foundation-need-generation-contract.mjs"
      - "scripts/certify-local-atlas-staging-packages.mjs"
      - "scripts/atlas-staging-package.test.mjs"
      - "scripts/local-supabase-status.mjs"
      - "scripts/local-supabase-status.test.mjs"
      - "scripts/provision-local-atlas-identity.mjs"
      - "scripts/verify-local-supabase-connection.mjs"
      - "scripts/provision-local-pa06c-fixture.mjs"
      - "scripts/verify-local-pa06c-supplier-evidence.mjs"
      - "scripts/import-local-master-data-snapshot.mjs"
      - "scripts/verify-local-rmvp01-master-data.mjs"
      - "scripts/verify-local-rmvp02a-recipes.mjs"
      - "scripts/verify-local-rmvp03a-planning-inputs.mjs"
      - "scripts/verify-local-rmvp04-need-generation.mjs"
      - "scripts/verify-local-planning-contract-01.mjs"
      - "scripts/verify-local-rmvp05-confirmed-need-review.mjs"
      - "scripts/verify-local-rmvp06-confirmed-need-validation.mjs"
      - "scripts/verify-local-rmvp07-confirmed-need-approval-release.mjs"
      - "scripts/verify-local-school-catering-procurement.mjs"
      - "src/modules/atlas/connection/**"
      - "src/modules/atlas/evidence/**"
      - "src/modules/atlas/master-data/**"
      - "src/modules/atlas/recipes/**"
      - "src/modules/atlas/planning-inputs/**"
      - "src/modules/admin/SchoolAdminWorkbench.tsx"
      - "src/modules/admin/IngredientSupplierAdminWorkbench.tsx"
      - "src/modules/admin/DishRecipeAdminWorkbench.tsx"
      - ".env.example"
      - "package.json"
      - "pnpm-lock.yaml"

  push:
    branches:
      - main
    paths:
      - ".github/workflows/supabase-integration.yml"
      - "supabase/**"
      - "scripts/atlas-staging-contract.mjs"
      - "scripts/atlas-staging-contract.test.mjs"
      - "scripts/deploy-atlas-staging.mjs"
      - "scripts/certify-frontend.mjs"
      - "scripts/certify-supabase-full-integration.mjs"
      - "scripts/verify-atlas-staging.mjs"
      - "scripts/install-atlas-staging-package.mjs"
      - "scripts/install-local-foundation-need-generation-contract.mjs"
      - "scripts/certify-local-atlas-staging-packages.mjs"
      - "scripts/atlas-staging-package.test.mjs"
      - "scripts/local-supabase-status.mjs"
      - "scripts/local-supabase-status.test.mjs"
      - "scripts/provision-local-atlas-identity.mjs"
      - "scripts/verify-local-supabase-connection.mjs"
      - "scripts/provision-local-pa06c-fixture.mjs"
      - "scripts/verify-local-pa06c-supplier-evidence.mjs"
      - "scripts/import-local-master-data-snapshot.mjs"
      - "scripts/verify-local-rmvp01-master-data.mjs"
      - "scripts/verify-local-rmvp02a-recipes.mjs"
      - "scripts/verify-local-rmvp03a-planning-inputs.mjs"
      - "scripts/verify-local-rmvp04-need-generation.mjs"
      - "scripts/verify-local-planning-contract-01.mjs"
      - "scripts/verify-local-rmvp05-confirmed-need-review.mjs"
      - "scripts/verify-local-rmvp06-confirmed-need-validation.mjs"
      - "scripts/verify-local-rmvp07-confirmed-need-approval-release.mjs"
      - "scripts/verify-local-school-catering-procurement.mjs"
      - "src/modules/atlas/connection/**"
      - "src/modules/atlas/evidence/**"
      - "src/modules/atlas/master-data/**"
      - "src/modules/atlas/recipes/**"
      - "src/modules/atlas/planning-inputs/**"
      - "src/modules/admin/SchoolAdminWorkbench.tsx"
      - "src/modules/admin/IngredientSupplierAdminWorkbench.tsx"
      - "src/modules/admin/DishRecipeAdminWorkbench.tsx"
      - ".env.example"
      - "package.json"
      - "pnpm-lock.yaml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Supabase Smoke
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == true &&
      (github.event.action == 'opened' ||
      github.event.action == 'synchronize' ||
      github.event.action == 'reopened')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start reduced local Supabase
        shell: bash
        run: |
          set -uo pipefail
          start_log="${RUNNER_TEMP}/supabase-start.log"

          if pnpm exec supabase start \
            --exclude edge-runtime,imgproxy,logflare,mailpit,postgres-meta,realtime,storage-api,studio,supavisor,vector \
            >"${start_log}" 2>&1; then
            echo "Reduced local Supabase stack started successfully."
          else
            echo "::error::Reduced local Supabase stack failed to start."
            sed -E \
              -e '/(ANON_KEY|SERVICE_ROLE_KEY|SECRET_KEY|PUBLISHABLE_KEY|anon key|service.?role key|publishable key|secret key|JWT secret|DB URL|DATABASE_URL|postgres(ql)?:\/\/)/Id' \
              -e 's/eyJ[A-Za-z0-9._-]+/[REDACTED_JWT]/g' \
              -e 's/sb_publishable_[A-Za-z0-9._-]+/[REDACTED_PUBLISHABLE_KEY]/g' \
              -e 's/sb_secret_[A-Za-z0-9._-]+/[REDACTED_SECRET_KEY]/g' \
              -e 's/(Bearer )[A-Za-z0-9._-]+/\1[REDACTED]/g' \
              "${start_log}" | tail -n 120
            exit 1
          fi

      - name: Reset and run bounded database smoke
        run: |
          pnpm exec supabase db reset --local --no-seed
          pnpm exec supabase test db supabase/tests/atlas_current_platform_security_catalog.sql --local
          pnpm exec supabase test db supabase/tests/school_catering_handoff_allocation.sql --local
          pnpm exec supabase test db supabase/tests/school_catering_planning_correction.sql --local
          pnpm exec supabase test db supabase/tests/pantry_02_connected_pantry_source.sql --local
          pnpm exec supabase test db supabase/tests/rmvp_03b_connected_planning_input_readiness.sql --local
          pnpm exec supabase test db supabase/tests/planning_contract_01_atomic_planning_boundaries.sql --local
          pnpm exec supabase test db supabase/tests/planning_contract_02b_selective_confirmation_continuity.sql --local
          pnpm exec supabase db query --local --file supabase/local/pa_06b_synthetic_identity.sql
          pnpm exec supabase db query --local --file supabase/local/rmvp_05_browser_fixture.sql
          pnpm exec supabase test db supabase/tests/rmvp_06_connected_confirmed_need_validation.sql --local
          pnpm exec supabase test db supabase/tests/rmvp_07_connected_confirmed_need_approval_release.sql --local
          pnpm exec supabase test db supabase/tests/d037_confirmed_need_save_release_boundary.sql --local
          pnpm exec supabase db reset --local --no-seed

      - name: Provision deterministic RMVP-07 browser identity
        run: pnpm local:auth:provision

      - name: Verify short browser-key Confirmed Need Save and Release
        run: pnpm verify:local:rmvp07

      - name: Capture bounded failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e

          sanitize() {
            sed -E \
              -e '/(ANON_KEY|SERVICE_ROLE_KEY|SECRET_KEY|PUBLISHABLE_KEY|anon key|service.?role key|publishable key|secret key|JWT secret|DB URL|DATABASE_URL|postgres(ql)?:\/\/)/Id' \
              -e 's/eyJ[A-Za-z0-9._-]+/[REDACTED_JWT]/g' \
              -e 's/sb_publishable_[A-Za-z0-9._-]+/[REDACTED_PUBLISHABLE_KEY]/g' \
              -e 's/sb_secret_[A-Za-z0-9._-]+/[REDACTED_SECRET_KEY]/g' \
              -e 's/(Bearer )[A-Za-z0-9._-]+/\1[REDACTED]/g'
          }

          free -h
          df -h
          docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
          mapfile -t containers < <(
            docker ps -a --format '{{.Names}}' |
              grep -E '^supabase_(kong|auth|rest|db)_' || true
          )
          for container in "${containers[@]}"; do
            docker inspect --format \
              'name={{.Name}} image={{.Config.Image}} state={{.State.Status}} exit_code={{.State.ExitCode}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} restart_count={{.RestartCount}}' \
              "${container}"
            docker logs --tail 160 "${container}" 2>&1 | sanitize | tail -n 160
          done

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup || true

  full-integration:
    name: Supabase Full Integration
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      (github.event.action == 'ready_for_review' ||
      (github.event.action == 'synchronize' &&
      github.event.pull_request.draft == false)))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository Supabase Full Integration certification
        run: pnpm certify:supabase:full-integration
