name: UI Review Export

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-review-export-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-review-artifact:
    name: Build UI review artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build Vite app review
        run: pnpm build:review

      - name: Add Vite app review launcher
        run: node scripts/create-review-launcher.mjs dist "Open Atlas Review.bat" 4173

      - name: Upload Vite app review artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-ui-review
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Build Storybook review
        run: pnpm build-storybook

      - name: Add Storybook review launcher
        run: node scripts/create-review-launcher.mjs storybook-static "Open Storybook Review.bat" 6006

      - name: Upload Storybook review artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-storybook-review
          path: storybook-static/
          if-no-files-found: error
          retention-days: 7
