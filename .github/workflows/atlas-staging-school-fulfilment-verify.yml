name: Atlas Staging School Fulfilment Verify

on:
  workflow_dispatch:
    inputs:
      deployed_commit_sha:
        description: Exact deployed merged-main business SHA being certified
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-school-fulfilment:
    name: Read-only Atlas staging School fulfilment verification
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: atlas-staging
    env:
      ATLAS_STAGING_PROJECT_REF: ${{ vars.ATLAS_STAGING_PROJECT_REF }}
      VITE_ATLAS_ENVIRONMENT: ${{ vars.VITE_ATLAS_ENVIRONMENT }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      ATLAS_STAGING_TEST_EMAIL: ${{ vars.ATLAS_STAGING_TEST_EMAIL }}
      ATLAS_STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.ATLAS_STAGING_SUPABASE_ACCESS_TOKEN }}
      ATLAS_STAGING_TEST_PASSWORD: ${{ secrets.ATLAS_STAGING_TEST_PASSWORD }}
      SUPABASE_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out the verifier implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Fetch main for ancestry verification
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Verify the deployed and verifier authorities
        shell: bash
        env:
          DEPLOYED_COMMIT_SHA: ${{ inputs.deployed_commit_sha }}
          WORKFLOW_EXECUTION_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deployed="$DEPLOYED_COMMIT_SHA"
          verifier="$(git rev-parse HEAD)"
          if [[ ! "$deployed" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Deployed business commit must be a full lowercase SHA."
            exit 1
          fi
          if [[ "$verifier" != "$WORKFLOW_EXECUTION_SHA" ]]; then
            echo "::error::Checked-out verifier does not match the workflow execution SHA."
            exit 1
          fi
          if ! git cat-file -e "${deployed}^{commit}" 2>/dev/null; then
            echo "::error::Deployed business commit does not exist in the repository."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$deployed" origin/main; then
            echo "::error::Deployed business commit is not contained in origin/main."
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Checked-out worktree is not clean."
            exit 1
          fi
          echo "Deployed business SHA: $deployed"
          echo "Verifier implementation SHA: $verifier"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate the protected target and read plan
        run: pnpm atlas:staging:school-fulfilment:verify -- --dry-run

      - name: Verify School fulfilment scenarios
        run: pnpm atlas:staging:school-fulfilment:verify
