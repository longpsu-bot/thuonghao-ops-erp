name: Atlas Staging Planning Closeout

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact full commit SHA already certified on main
        required: true
        type: string
      persist_rehearsal:
        description: Run one Confirmed Need Save and reopen through Chrome
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

jobs:
  planning-closeout:
    name: Guarded Planning closeout
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: atlas-staging
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ATLAS_PLANNING_PREVIEW_URL: ${{ vars.ATLAS_PLANNING_PREVIEW_URL }}
      ATLAS_PLANNING_PREVIEW_SHA: ${{ vars.ATLAS_PLANNING_PREVIEW_SHA }}
      ATLAS_STAGING_PROJECT_REF: ${{ vars.ATLAS_STAGING_PROJECT_REF }}
      VITE_ATLAS_ENVIRONMENT: ${{ vars.VITE_ATLAS_ENVIRONMENT }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      ATLAS_STAGING_TEST_EMAIL: ${{ vars.ATLAS_STAGING_TEST_EMAIL }}
      ATLAS_STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.ATLAS_STAGING_SUPABASE_ACCESS_TOKEN }}
      ATLAS_STAGING_DB_PASSWORD: ${{ secrets.ATLAS_STAGING_DB_PASSWORD }}
      ATLAS_STAGING_TEST_PASSWORD: ${{ secrets.ATLAS_STAGING_TEST_PASSWORD }}
      SUPABASE_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out the requested exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Fetch main for ancestry verification
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Run non-mutating protected preflight
        run: pnpm atlas:staging:deploy -- --commit-sha "${{ inputs.commit_sha }}" --certification github --preflight

      - name: Verify read-only checkpoint and browser closeout
        env:
          PERSIST_REHEARSAL: ${{ inputs.persist_rehearsal }}
        run: |
          if [ "$PERSIST_REHEARSAL" != "true" ]; then
            echo "Browser closeout requires explicit persist_rehearsal=true" >&2
            exit 1
          fi
          command -v google-chrome
          node scripts/verify-staging-planning-closeout.mjs --commit-sha "${{ inputs.commit_sha }}" --persist-rehearsal
