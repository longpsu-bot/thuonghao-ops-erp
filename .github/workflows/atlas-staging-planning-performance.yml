name: Atlas Staging Planning Performance

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact full commit SHA already certified on main
        required: true
        type: string
      purchase_acceptance:
        description: One hosted migration-105 Purchase Preparation and exact replay
        required: true
        type: boolean
        default: false
      replay_evidence_run_id:
        description: Replay only the confirmed successful request in this original run artifact
        required: false
        type: string
      procurement_read_acceptance:
        description: Read-only migration-106 released Supplier Allocation HTTP acceptance
        required: false
        type: boolean
        default: false
      phase_b_evidence_run_id:
        description: Successful Phase A run whose protected artifact authorizes UI rehearsal
        required: false
        type: string

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  planning-performance:
    name: Guarded Planning performance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: atlas-staging
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ATLAS_STAGING_PROJECT_REF: ${{ vars.ATLAS_STAGING_PROJECT_REF }}
      VITE_ATLAS_ENVIRONMENT: ${{ vars.VITE_ATLAS_ENVIRONMENT }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      ATLAS_STAGING_TEST_EMAIL: ${{ vars.ATLAS_STAGING_TEST_EMAIL }}
      ATLAS_STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.ATLAS_STAGING_SUPABASE_ACCESS_TOKEN }}
      ATLAS_STAGING_DB_PASSWORD: ${{ secrets.ATLAS_STAGING_DB_PASSWORD }}
      ATLAS_STAGING_TEST_PASSWORD: ${{ secrets.ATLAS_STAGING_TEST_PASSWORD }}
      ATLAS_PLANNING_PREVIEW_URL: ${{ vars.ATLAS_PLANNING_PREVIEW_URL }}
      ATLAS_PLANNING_PREVIEW_SHA: ${{ vars.ATLAS_PLANNING_PREVIEW_SHA }}
      SUPABASE_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out the requested exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Reject mixed acceptance modes
        env:
          READ_ACCEPTANCE: ${{ inputs.procurement_read_acceptance }}
          PURCHASE_ACCEPTANCE: ${{ inputs.purchase_acceptance }}
          REPLAY_RUN: ${{ inputs.replay_evidence_run_id }}
          PHASE_B_RUN: ${{ inputs.phase_b_evidence_run_id }}
        run: |
          if [[ "$READ_ACCEPTANCE" == "true" && ( "$PURCHASE_ACCEPTANCE" == "true" || -n "$REPLAY_RUN" ) ]]; then
            echo "::error::Read-only rehearsal cannot execute a preparation or replay command."
            exit 1
          fi
          if [[ -n "$PHASE_B_RUN" && ( "$READ_ACCEPTANCE" != "true" || ! "$PHASE_B_RUN" =~ ^[0-9]+$ ) ]]; then
            echo "::error::UI rehearsal requires the read-only mode and a numeric Phase A run."
            exit 1
          fi

      - name: Fetch main for ancestry verification
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Run non-mutating protected preflight
        run: pnpm atlas:staging:deploy -- --commit-sha "${{ inputs.commit_sha }}" --certification github --preflight

      - name: Verify rollback-only Planning performance
        if: ${{ inputs.purchase_acceptance == false && inputs.procurement_read_acceptance != true }}
        run: node scripts/verify-staging-planning-performance.mjs --commit-sha "${{ inputs.commit_sha }}"

      - name: Load read-only Procurement harness from workflow revision
        if: ${{ inputs.procurement_read_acceptance == true }}
        env:
          HARNESS_SHA: ${{ github.workflow_sha }}
        run: |
          git fetch origin "$HARNESS_SHA"
          git show "$HARNESS_SHA:scripts/atlas-procurement-cutover.mjs" > scripts/atlas-procurement-cutover.mjs
          git show "$HARNESS_SHA:scripts/atlas-procurement-cutover.test.mjs" > scripts/atlas-procurement-cutover.test.mjs
          git show "$HARNESS_SHA:scripts/atlas-procurement-cutover-browser.mjs" > scripts/atlas-procurement-cutover-browser.mjs
          git show "$HARNESS_SHA:scripts/atlas-procurement-cutover-browser.test.mjs" > scripts/atlas-procurement-cutover-browser.test.mjs
          pnpm exec vitest run scripts/atlas-procurement-cutover.test.mjs scripts/atlas-procurement-cutover-browser.test.mjs --environment node

      - name: Read released Supplier Allocation through authenticated hosted HTTP
        if: ${{ inputs.procurement_read_acceptance == true && inputs.phase_b_evidence_run_id == '' }}
        env:
          ATLAS_ACCEPTANCE_MAIN_SHA: ${{ inputs.commit_sha }}
        run: node scripts/atlas-procurement-cutover.mjs

      - name: Verify successful Phase A workflow identity
        if: ${{ inputs.procurement_read_acceptance == true && inputs.phase_b_evidence_run_id != '' }}
        env:
          PHASE_A_RUN: ${{ inputs.phase_b_evidence_run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PHASE_A_RUN" --jq '{conclusion,event,head_branch,path}' > /tmp/atlas-phase-a-run.json
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; const r=JSON.parse(fs.readFileSync('/tmp/atlas-phase-a-run.json')); assert.equal(r.conclusion,'success'); assert.equal(r.event,'workflow_dispatch'); assert.equal(r.head_branch,'codex/atlas-procurement-cutover-rehearsal'); assert.ok(r.path.startsWith('.github/workflows/atlas-staging-planning-performance.yml'));"

      - name: Load successful Phase A evidence
        if: ${{ inputs.procurement_read_acceptance == true && inputs.phase_b_evidence_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: atlas-procurement-cutover-${{ inputs.phase_b_evidence_run_id }}
          path: artifacts/atlas-procurement-cutover
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.phase_b_evidence_run_id }}

      - name: Rehearse connected Procurement UI with business commands blocked
        if: ${{ inputs.procurement_read_acceptance == true && inputs.phase_b_evidence_run_id != '' }}
        run: node scripts/atlas-procurement-cutover-browser.mjs

      - name: Preserve read-only Procurement acceptance evidence
        if: ${{ always() && inputs.procurement_read_acceptance == true }}
        uses: actions/upload-artifact@v4
        with:
          name: atlas-procurement-cutover-${{ github.run_id }}
          path: artifacts/atlas-procurement-cutover
          if-no-files-found: warn
          retention-days: 14

      - name: Load bounded acceptance harness from workflow revision
        if: ${{ inputs.purchase_acceptance == true }}
        env:
          HARNESS_SHA: ${{ github.workflow_sha }}
        run: |
          git fetch origin "$HARNESS_SHA"
          git show "$HARNESS_SHA:scripts/hosted-purchase-acceptance.mjs" > scripts/hosted-purchase-acceptance.mjs
          git show "$HARNESS_SHA:scripts/hosted-purchase-acceptance.test.mjs" > scripts/hosted-purchase-acceptance.test.mjs
          pnpm exec vitest run scripts/hosted-purchase-acceptance.test.mjs --environment node

      - name: Load original command identity for exact replay only
        if: ${{ inputs.purchase_acceptance == true && inputs.replay_evidence_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: hosted-purchase-acceptance-${{ inputs.replay_evidence_run_id }}
          path: artifacts/hosted-purchase-original
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.replay_evidence_run_id }}

      - name: Execute hosted Purchase Preparation acceptance
        if: ${{ inputs.purchase_acceptance == true }}
        env:
          ATLAS_ACCEPTANCE_MAIN_SHA: ${{ inputs.commit_sha }}
          ATLAS_ACCEPTANCE_REPLAY_RUN_ID: ${{ inputs.replay_evidence_run_id }}
        run: node scripts/hosted-purchase-acceptance.mjs

      - name: Preserve acceptance and recovery evidence
        if: ${{ always() && inputs.purchase_acceptance == true }}
        uses: actions/upload-artifact@v4
        with:
          name: hosted-purchase-acceptance-${{ github.run_id }}
          path: artifacts/hosted-purchase-acceptance
          if-no-files-found: warn
          retention-days: 14
